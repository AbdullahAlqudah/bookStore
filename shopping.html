<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            width: 500px;
            margin: 50px auto;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        li {
            margin: 10px 0;
        }

        li button {
            margin-left: 15px;
        }
    </style>
</head>

<body>

    <h1>My Shopping List</h1>

    <form id="shoppingForm">

        <input
            type="text"
            id="itemInput"
            placeholder="Enter item"
        >

        <button type="submit">
            Add Item
        </button>

    </form>

    <ul id="shoppingList"></ul>

    <script src="shopping.js"></script>

</body>

</html>
